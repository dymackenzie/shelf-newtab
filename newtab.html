<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<!-- chrome's own logo, otherwise the tab falls back to the extension icon -->
<link rel="icon" type="image/svg+xml" href="icons/chrome.svg">
<link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="theme.css">
<script src="js/boot.js"></script>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<header class="top">
  <p class="brand"><b>Shelf</b><span id="where"></span></p>
  <nav class="dock">
    <button id="edit" title="Edit the shelf">Edit</button>
    <button id="gear" title="Settings">Settings</button>
    <button id="add" class="pill" title="Add a book">Add a book</button>
  </nav>
</header>
<div class="page">
  <p id="hint" class="mono" hidden>drag a book to move it, click one to change it</p>
  <main id="shelves"></main>
</div>
<div id="panel" class="panel" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
