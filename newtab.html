<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New tab</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<header class="top">
  <p class="brand"><b>Shelf</b><span id="where"></span></p>
  <nav class="dock">
    <button id="edit" title="Edit the shelf">Edit</button>
    <button id="gear" title="Settings">Settings</button>
    <button id="add" class="pill" title="Add a book">Add a book</button>
  </nav>
</header>
<div class="page">
  <aside id="index" class="index"></aside>
  <div class="col">
    <h1 id="date"></h1>
    <p id="hint" class="mono" hidden>drag a book to move it, click one to change it</p>
    <main id="shelves"></main>
  </div>
</div>
<div id="panel" class="panel" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
